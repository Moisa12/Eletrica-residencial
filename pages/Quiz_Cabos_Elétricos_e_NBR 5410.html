<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Cabos Elétricos e NBR 5410</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <script id="MathJax-script" async
            src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7fafc;
            color: #2d3748;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .quiz-container {
            max-width: 700px;
            width: 100%;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }
        .question-card {
            border-bottom: 1px solid #e2e8f0;
        }
        .option-button {
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            border: 1px solid #cbd5e0;
        }
        .option-button:not([disabled]):hover {
            background-color: #ebf4ff;
            border-color: #4299e1;
        }
        .correct-answer {
            background-color: #48bb78 !important;
            color: white !important;
            border-color: #38a169 !important;
            font-weight: bold;
        }
        .incorrect-answer {
            background-color: #f56565 !important;
            color: white !important;
            border-color: #e53e3e !important;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="quiz-container p-6 sm:p-10">
        <h1 class="text-3xl font-extrabold text-blue-600 mb-6 text-center border-b pb-3">
            Quiz: Cabos Elétricos e NBR 5410
        </h1>
        <p class="text-center text-gray-600 mb-8">Teste seu conhecimento sobre condutores, cores e regras de emendas.</p>

        <div id="quiz-area"></div>

        <div id="score-card" class="mt-8 p-6 bg-gray-100 rounded-lg hidden">
            <h2 class="text-2xl font-bold text-center text-gray-700">Resultados Finais</h2>
            <p class="text-xl text-center mt-3">Você acertou <span id="correct-count" class="font-extrabold text-blue-600"></span> de 10 perguntas!</p>
            <div id="final-message" class="text-lg font-semibold text-center mt-4"></div>
        </div>
    </div>

    <script>
        const quizQuestions = [
            {
                q: "1. De acordo com a ABNT NBR 5410, qual é a cor de isolamento reservada para o condutor Neutro (N) em instalações elétricas de baixa tensão?",
                options: [
                    "Verde ou Verde/Amarelo",
                    "Preto, Vermelho ou Marrom",
                    "Azul Claro",
                    "Qualquer cor, desde que identificada com fita"
                ],
                answer: "Azul Claro",
                rationale: "A NBR 5410 exige que o condutor Neutro seja identificado pela cor Azul Claro, sendo este uso exclusivo."
            },
            {
                q: "2. Qual é a principal diferença de composição entre um 'Fio Elétrico' (condutor rígido) e um 'Cabo Elétrico' (condutor flexível)?",
                options: [
                    "O fio é feito de alumínio, e o cabo é feito de cobre.",
                    "O fio é revestido por PVC de dupla camada, e o cabo por PVC de camada única.",
                    "O fio é composto por um único filamento maciço, e o cabo por múltiplos filamentos finos trançados.",
                    "O fio é para circuitos de iluminação, e o cabo para circuitos de tomadas."
                ],
                answer: "O fio é composto por um único filamento maciço, e o cabo por múltiplos filamentos finos trançados.",
                rationale: "O fio possui um único condutor rígido, enquanto o cabo é formado por vários fios finos que lhe conferem flexibilidade (encordoamento)."
            },
            {
                q: "3. Qual a principal exigência da NBR 5410 em relação ao local onde as emendas de condutores devem ser realizadas?",
                options: [
                    "Em qualquer parte do eletroduto, desde que bem isoladas.",
                    "Apenas dentro de quadros de distribuição (QDC).",
                    "Exclusivamente nas caixas de passagem e derivação.",
                    "Nos bornes de tomadas e interruptores, junto ao dispositivo."
                ],
                answer: "Exclusivamente nas caixas de passagem e derivação.",
                rationale: "As caixas de passagem são os únicos locais onde as emendas são permitidas para garantir a inspeção e manutenção."
            },
            {
                q: "4. Qual emenda manual é utilizada para criar um ramal ou ramificação a partir de um condutor principal que não é cortado?",
                options: [
                    "Emenda Rabo de Rato",
                    "Emenda de Prolongamento",
                    "Emenda de Derivação",
                    "Emenda Soldada"
                ],
                answer: "Emenda de Derivação",
                rationale: "A Emenda de Derivação (ou em T) é especificamente usada para ramificar um condutor principal sem interrompê-lo."
            },
            {
                q: "5. Qual é a principal vantagem da utilização de cabos flexíveis (em comparação com fios rígidos) em novas instalações, de acordo com a prática moderna?",
                options: [
                    "Maior capacidade de condução de corrente (Amperagem).",
                    "Resistência superior a altas temperaturas.",
                    "Facilidade e rapidez na instalação, especialmente em eletrodutos com curvas.",
                    "Menor custo de aquisição por metro."
                ],
                answer: "Facilidade e rapidez na instalação, especialmente em eletrodutos com curvas.",
                rationale: "A flexibilidade do cabo permite que ele deslize e se adapte mais facilmente a curvas e desvios no eletroduto, otimizando o tempo de trabalho."
            },
            {
                q: "6. Para qual condutor a NBR 5410 exige, de forma exclusiva, a cor de isolamento Verde ou Verde/Amarelo?",
                options: [
                    "Condutor de Fase (L)",
                    "Condutor Neutro (N)",
                    "Condutor de Retorno",
                    "Condutor de Proteção (PE)"
                ],
                answer: "Condutor de Proteção (PE)",
                rationale: "A cor Verde ou a combinação Verde/Amarelo é de uso exclusivo para o Condutor de Proteção (Terra/PE) em baixa tensão."
            },
            {
                q: "7. O que a NBR 5410 define como a principal finalidade das instalações elétricas de baixa tensão?",
                options: [
                    "Garantir o menor custo de projeto e execução da obra.",
                    "Proporcionar a máxima estética e design para os pontos de utilização.",
                    "Garantir a segurança de pessoas e animais, e o funcionamento adequado da instalação.",
                    "Permitir o uso de cabos com seções inferiores às recomendadas, se forem flexíveis."
                ],
                answer: "Garantir a segurança de pessoas e animais, e o funcionamento adequado da instalação.",
                rationale: "A segurança contra choques e incêndios, juntamente com o desempenho e a conservação dos bens, são os pilares da NBR 5410."
            },
            {
                q: "8. Em relação à emenda Rabo de Rato, qual é a sua aplicação mais comum?",
                options: [
                    "Estender o comprimento de um cabo em linha reta.",
                    "Conectar um eletrodoméstico à tomada.",
                    "Unir dois ou mais condutores de topo dentro de caixas de passagem.",
                    "Criar um ponto de ramificação lateral em um cabo de grande diâmetro."
                ],
                answer: "Unir dois ou mais condutores de topo dentro de caixas de passagem.",
                rationale: "A emenda Rabo de Rato é usada para unir o final de vários condutores juntos dentro de uma caixa, sendo ideal para circuitos de iluminação."
            },
            {
                q: "9. Qual é a desvantagem primária da Emenda Manual em relação ao uso de Conectores (como o Wago ou de Torção), conforme as práticas modernas de instalação?",
                options: [
                    "É um método proibido pela NBR 5410.",
                    "A emenda manual tem maior custo total.",
                    "A dependência da qualidade de isolamento manual e risco de contato imperfeito.",
                    "A emenda manual só pode ser usada com fios rígidos e não com cabos flexíveis."
                ],
                answer: "A dependência da qualidade de isolamento manual e risco de contato imperfeito.",
                rationale: "A emenda manual exige perfeição no isolamento (fita isolante) e depende da força do aperto, o que aumenta o risco de mau contato e aquecimento se mal executada. Conectores garantem padronização."
            },
            {
                q: "10. Em relação à solda em condutores elétricos, o que é permitido e o que é proibido pela NBR 5410 em instalações de baixa tensão?",
                options: [
                    "A solda é obrigatória em todas as emendas de prolongamento.",
                    "É proibido soldar emendas, mas permitido soldar pontas para bornes de disjuntores.",
                    "É permitido soldar emendas para reforço, mas proibido soldar as pontas dos cabos para conexão em bornes (parafusos).",
                    "É proibido o uso de solda em qualquer parte da instalação elétrica."
                ],
                answer: "É permitido soldar emendas para reforço, mas proibido soldar as pontas dos cabos para conexão em bornes (parafusos).",
                rationale: "A solda nas pontas é proibida, pois pode causar o 'escoamento a frio' do metal sob pressão do parafuso, comprometendo a conexão e causando aquecimento."
            }
        ];

        let questionsAnswered = 0;
        let correctAnswersCount = 0;

        function renderQuiz() {
            const quizArea = document.getElementById('quiz-area');
            quizArea.innerHTML = '';
            
            quizQuestions.forEach((qData, index) => {
                let optionsHtml = '';
                const shuffledOptions = shuffleArray([...qData.options]);

                shuffledOptions.forEach((optionText, optIndex) => {
                    optionsHtml += `
                        <button data-question-index="${index}"
                                data-option-text="${optionText}"
                                onclick="checkAnswer(this, ${index})"
                                class="option-button w-full text-left p-3 rounded-lg block my-2 text-gray-700">
                            ${String.fromCharCode(65 + optIndex)}. ${optionText}
                        </button>
                    `;
                });

                const questionHtml = `
                    <div id="q-card-${index}" class="question-card p-4">
                        <h3 class="text-lg font-bold mb-3">${qData.q}</h3>
                        <div id="options-${index}">${optionsHtml}</div>
                        <div id="feedback-${index}" class="mt-3 p-3 text-sm font-semibold rounded-lg hidden"></div>
                    </div>
                `;
                quizArea.innerHTML += questionHtml;
            });

            if (typeof MathJax !== 'undefined') {
                MathJax.typesetPromise([quizArea]);
            }
        }
        
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        window.checkAnswer = function(selectedButton, qIndex) {
            const qData = quizQuestions[qIndex];
            const selectedText = selectedButton.getAttribute('data-option-text').trim();
            const isCorrect = selectedText === qData.answer;
            const optionsContainer = document.getElementById(`options-${qIndex}`);
            const feedbackElement = document.getElementById(`feedback-${qIndex}`);
            const buttons = optionsContainer.querySelectorAll('button');

            buttons.forEach(btn => { btn.disabled = true; });
            
            if (!selectedButton.classList.contains('incorrect-answer') && !selectedButton.classList.contains('correct-answer')) {
                questionsAnswered++;
                if (isCorrect) { correctAnswersCount++; }
            }
            
            selectedButton.classList.add(isCorrect ? 'correct-answer' : 'incorrect-answer');

            feedbackElement.classList.remove('hidden');
            if (isCorrect) {
                feedbackElement.classList.add('bg-green-100', 'text-green-800');
                feedbackElement.innerHTML = `Parabéns, você acertou! (${qData.rationale})`;
            } else {
                feedbackElement.classList.add('bg-red-100', 'text-red-800');
                feedbackElement.innerHTML = `Incorreto. A resposta correta é: "${qData.answer}". (${qData.rationale})`;
                
                buttons.forEach(btn => {
                    if (btn.getAttribute('data-option-text').trim() === qData.answer) {
                        btn.classList.add('correct-answer');
                    }
                });
            }

            if (typeof MathJax !== 'undefined') {
                MathJax.typesetPromise([feedbackElement, optionsContainer]);
            }
            
            if (questionsAnswered === quizQuestions.length) { displayFinalScore(); }
        };

        function displayFinalScore() {
            const scoreCard = document.getElementById('score-card');
            const correctCountSpan = document.getElementById('correct-count');
            const finalMessageDiv = document.getElementById('final-message');

            correctCountSpan.textContent = correctAnswersCount;
            scoreCard.classList.remove('hidden');

            let message = '';
            if (correctAnswersCount === 10) {
                message = "Excelente! Você demonstrou total domínio das normas e condutores elétricos.";
                finalMessageDiv.className = "text-lg font-semibold text-center mt-4 text-green-600";
            } else if (correctAnswersCount >= 7) {
                message = "Muito bom! Você acertou a maioria das questões. Revise os pontos fracos.";
                finalMessageDiv.className = "text-lg font-semibold text-center mt-4 text-blue-600";
            } else {
                message = "Continue estudando! Revise as normas de cores e emendas para melhorar.";
                finalMessageDiv.className = "text-lg font-semibold text-center mt-4 text-red-600";
            }
            finalMessageDiv.textContent = message;
            scoreCard.scrollIntoView({ behavior: 'smooth' });
        }

        window.onload = renderQuiz;
    </script>
</body>
</html>
