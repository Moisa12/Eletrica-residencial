<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulado de Circuitos Elétricos - Estático</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <script id="MathJax-script" async
            src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>

    <style>
        /* Define a fonte Inter como padrão */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7fafc; /* Fundo claro */
            color: #2d3748; /* Texto escuro */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .quiz-container {
            max-width: 700px;
            width: 100%;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }
        .question-card {
            border-bottom: 1px solid #e2e8f0;
        }
        .option-button {
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            border: 1px solid #cbd5e0;
        }
        .option-button:not([disabled]):hover {
            background-color: #ebf4ff;
            border-color: #4299e1;
        }
        .correct-answer {
            background-color: #48bb78 !important; /* Verde */
            color: white !important;
            border-color: #38a169 !important;
            font-weight: bold;
        }
        .incorrect-answer {
            background-color: #f56565 !important; /* Vermelho */
            color: white !important;
            border-color: #e53e3e !important;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="quiz-container p-6 sm:p-10">
        <h1 class="text-3xl font-extrabold text-blue-600 mb-6 text-center border-b pb-3">
            Simulado: Circuitos Elétricos
        </h1>
        <p class="text-center text-gray-600 mb-8">Teste seu conhecimento com estas 10 perguntas.</p>

        <div id="quiz-area">
        </div>

        <div id="score-card" class="mt-8 p-6 bg-gray-100 rounded-lg hidden">
            <h2 class="text-2xl font-bold text-center text-gray-700">Resultados Finais</h2>
            <p class="text-xl text-center mt-3">Você acertou <span id="correct-count" class="font-extrabold text-blue-600"></span> de 10 perguntas!</p>
            <div id="final-message" class="text-lg font-semibold text-center mt-4"></div>
        </div>
    </div>

    <script>
        const quizQuestions = [
            {
                q: "1. Em um circuito elétrico em série, o que acontece com a corrente elétrica ($I$) ao longo dos componentes?",
                options: [
                    "A corrente se divide proporcionalmente ao valor de cada resistência.",
                    "A corrente aumenta a cada novo componente adicionado ao circuito.",
                    "A corrente permanece rigorosamente a mesma em todos os componentes.",
                    "A corrente cai para zero imediatamente após passar pela primeira carga."
                ],
                answer: "A corrente permanece rigorosamente a mesma em todos os componentes.",
                rationale: "Como há um único caminho fechado para o fluxo de elétrons, a intensidade da corrente elétrica é idêntica em qualquer ponto de um circuito em série."
            },
            {
                q: "2. Se três resistores de $10\\ \\Omega$, $15\\ \\Omega$ e $20\\ \\Omega$ forem conectados em série, qual será a resistência equivalente ($R_{\\text{eq}}$) total?",
                options: ["$4.6\\ \\Omega$", "$45\\ \\Omega$", "$10\\ \\Omega$", "$60\\ \\Omega$"],
                answer: "$45\\ \\Omega$",
                rationale: "Em circuitos em série, basta somar os valores das resistências individuais: $10 + 15 + 20 = 45\\ \\Omega$."
            },
            {
                q: "3. Qual é o comportamento da tensão elétrica ($V$) nas cargas instaladas em um circuito puramente em paralelo?",
                options: [
                    "A tensão se divide igualmente pelo número de cargas presentes.",
                    "A tensão é exatamente a mesma em todos os componentes.",
                    "A tensão diminui conforme a distância da fonte de energia.",
                    "A tensão oscila dependendo do valor da corrente do circuito."
                ],
                answer: "A tensão é exatamente a mesma em todos os componentes.",
                rationale: "Em circuitos paralelos, todos os caminhos independentes estão conectados diretamente aos mesmos nós da fonte, garantindo que todos recebam a mesma tensão total."
            },
            {
                q: "4. Dois resistores idênticos de $40\\ \\Omega$ cada estão ligados em paralelo. Qual é a resistência equivalente total deste arranjo?",
                options: ["$80\\ \\Omega$", "$40\\ \\Omega$", "$20\\ \\Omega$", "$10\\ \\Omega$"],
                answer: "$20\\ \\Omega$",
                rationale: "Para resistores iguais em paralelo, dividimos o valor de um resistor pela quantidade total de ramos ($40 / 2 = 20\\ \\Omega$)."
            },
            {
                q: "5. Por que as instalações elétricas residenciais (lâmpadas e tomadas) são projetadas em paralelo e não em série?",
                options: [
                    "Para garantir que a corrente elétrica seja reduzida ao mínimo em toda a casa.",
                    "Para economizar fiação e condutores durante a etapa de infraestrutura.",
                    "Para que os equipamentos operem de forma independente e com a mesma tensão de projeto.",
                    "Porque circuitos em série são proibidos por gerarem energia reativa prejudicial."
                ],
                answer: "Para que os equipamentos operem de forma independente e com a mesma tensão de projeto.",
                rationale: "A ligação em paralelo garante independência: se uma lâmpada queimar, o circuito dos outros eletrodomésticos permanece fechado e recebendo a tensão nominal estável da concessionária."
            },
            {
                q: "6. Três resistores idênticos estão ligados em paralelo. Sabendo que a resistência equivalente total do conjunto é de $10\\ \\Omega$, qual é o valor individual de cada resistor?",
                options: ["$3.33\\ \\Omega$", "$10\\ \\Omega$", "$20\\ \\Omega$", "$30\\ \\Omega$"],
                answer: "$30\\ \\Omega$",
                rationale: "Usando a regra prática simplificada, se $R_{\\text{eq}} = R / n$, isolando o componente temos $R = R_{\\text{eq}} \\cdot n$. Logo, $10 \\cdot 3 = 30\\ \\Omega$."
            },
            {
                q: "7. O que caracteriza essencialmente um circuito elétrico classificado como Misto?",
                options: [
                    "Opera simultaneamente com Tensão Contínua (DC) e Alternada (AC).",
                    "Apresenta partes do circuito associadas em série e partes associadas em paralelo.",
                    "É composto obrigatoriamente por lâmpadas incandescentes e motores indutivos.",
                    "Possui fiações de cobre e de alumínio compartilhando o mesmo eletroduto."
                ],
                answer: "Apresenta partes do circuito associadas em série e partes associadas em paralelo.",
                rationale: "O circuito misto une as propriedades e comportamentos estruturais das conexões em série e paralelo em uma mesma malha elétrica."
            },
            {
                q: "8. Em um circuito em série alimentado por $120\\ V$ com $R_{\\text{eq}} = 60\\ \\Omega$, qual será a corrente elétrica total ($I$) circulante? (Dica: $I = V / R_{\\text{eq}}$)",
                options: ["$2\\ A$", "$0.5\\ A$", "$7200\\ A$", "$60\\ A$"],
                answer: "$2\\ A$",
                rationale: "Aplicando diretamente a Lei de Ohm para o circuito total: dividindo a tensão de alimentação pela resistência equivalente ($120 / 60$), obtém-se $2\\ A$."
            },
            {
                q: "9. Em um circuito em série com duas lâmpadas, se a tensão da fonte é de $12\\ V$ e a corrente que atravessa o circuito é de $0.5\\ A$, qual o valor da resistência total do sistema?",
                options: ["$6\\ \\Omega$", "$12\\ \\Omega$", "$24\\ \\Omega$", "$48\\ \\Omega$"],
                answer: "$24\\ \\Omega$",
                rationale: "Utilizando a Lei de Ohm adaptada para a resistência equivalente ($R_{\\text{eq}} = V / I$), dividimos $12$ por $0.5$, resultando em uma resistência equivalente de $24\\ \\Omega$."
            },
            {
                q: "10. Qual dos seguintes componentes de uma instalação residencial desempenha a função de 'Dispositivo de Manobra', sendo responsável por controlar e permitir o fluxo manual da corrente?",
                options: [
                    "Os fios condutores de cobre",
                    "O interruptor de luz",
                    "A lâmpada ou receptor",
                    "A caixa de distribuição"
                ],
                answer: "O interruptor de luz",
                rationale: "Os dispositivos de manobra têm o papel fundamental de controlar o fluxo elétrico do circuito, permitindo abrir ou fechar o caminho dos elétrons sob comando (como o interruptor residencial)."
            }
        ];

        let questionsAnswered = 0;
        let correctAnswersCount = 0;

        /**
         * Gera a estrutura de cards para cada pergunta.
         */
        function renderQuiz() {
            const quizArea = document.getElementById('quiz-area');
            quizArea.innerHTML = ''; 
            
            quizQuestions.forEach((qData, index) => {
                let optionsHtml = '';
                const shuffledOptions = shuffleArray([...qData.options]);

                shuffledOptions.forEach((optionText, optIndex) => {
                    optionsHtml += `
                        <button data-question-index="${index}"
                                data-option-text="${optionText}"
                                onclick="checkAnswer(this, ${index})"
                                class="option-button w-full text-left p-3 rounded-lg block my-2 text-gray-700">
                            ${String.fromCharCode(65 + optIndex)}. ${optionText}
                        </button>
                    `;
                });

                const questionHtml = `
                    <div id="q-card-${index}" class="question-card p-4">
                        <h3 class="text-lg font-bold mb-3">${qData.q}</h3>
                        <div id="options-${index}">${optionsHtml}</div>
                        <div id="feedback-${index}" class="mt-3 p-3 text-sm font-semibold rounded-lg hidden"></div>
                    </div>
                `;
                quizArea.innerHTML += questionHtml;
            });

            // Re-renderiza o MathJax para processar as fórmulas inseridas no DOM
            if (typeof MathJax !== 'undefined') {
                MathJax.typesetPromise([quizArea]);
            }
        }
        
        /**
         * Função de embaralhamento de arrays (Fisher-Yates)
         */
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        /**
         * Verifica a resposta selecionada.
         */
        window.checkAnswer = function(selectedButton, qIndex) {
            const qData = quizQuestions[qIndex];
            const selectedText = selectedButton.getAttribute('data-option-text').trim();
            const isCorrect = selectedText === qData.answer;
            const optionsContainer = document.getElementById(`options-${qIndex}`);
            const feedbackElement = document.getElementById(`feedback-${qIndex}`);
            const buttons = optionsContainer.querySelectorAll('button');

            // 1. Desabilita todos os botões da pergunta
            buttons.forEach(btn => {
                btn.disabled = true;
            });
            
            // 2. Conta a resposta
            if (!selectedButton.classList.contains('incorrect-answer') && !selectedButton.classList.contains('correct-answer')) {
                questionsAnswered++;
                if (isCorrect) {
                    correctAnswersCount++;
                }
            }
            
            // 3. Aplica o estilo de feedback
            selectedButton.classList.add(isCorrect ? 'correct-answer' : 'incorrect-answer');

            // 4. Exibe a mensagem de feedback
            feedbackElement.classList.remove('hidden');
            if (isCorrect) {
                feedbackElement.classList.add('bg-green-100', 'text-green-800');
                feedbackElement.innerHTML = `Parabéns, você acertou! (${qData.rationale})`;
            } else {
                feedbackElement.classList.add('bg-red-100', 'text-red-800');
                feedbackElement.innerHTML = `Incorreto. A resposta correta é: "${qData.answer}". (${qData.rationale})`;
                
                // Destaca a resposta correta
                buttons.forEach(btn => {
                    const btnText = btn.getAttribute('data-option-text').trim();
                    if (btnText === qData.answer) {
                        btn.classList.add('correct-answer');
                    }
                });
            }

            // Garante a correta renderização das fórmulas dentro do feedback
            if (typeof MathJax !== 'undefined') {
                MathJax.typesetPromise([feedbackElement, optionsContainer]);
            }
            
            // 5. Verifica se o quiz terminou
            if (questionsAnswered === quizQuestions.length) {
                displayFinalScore();
            }
        };

        /**
         * Exibe o placar final.
         */
        function displayFinalScore() {
            const scoreCard = document.getElementById('score-card');
            const correctCountSpan = document.getElementById('correct-count');
            const finalMessageDiv = document.getElementById('final-message');

            correctCountSpan.textContent = correctAnswersCount;
            scoreCard.classList.remove('hidden');

            let message = '';
            if (correctAnswersCount === quizQuestions.length) {
                message = "Excelente! Você demonstrou total domínio sobre análise de circuitos em série, paralelo e misto.";
                finalMessageDiv.className = "text-lg font-semibold text-center mt-4 text-green-600";
            } else if (correctAnswersCount >= 7) {
                message = "Muito bom! Você compreendeu bem as diferenças de comportamento da corrente e tensão nos circuitos.";
                finalMessageDiv.className = "text-lg font-semibold text-center mt-4 text-blue-600";
            } else {
                message = "Continue estudando! Revise as tabelas comparativas de propriedades e refaça os exercícios práticos calculando R_eq.";
                finalMessageDiv.className = "text-lg font-semibold text-center mt-4 text-red-600";
            }
            finalMessageDiv.textContent = message;

            // Rola suavemente até o score card final
            scoreCard.scrollIntoView({ behavior: 'smooth' });
        }

        // Inicia o quiz ao carregar a página
        window.onload = renderQuiz;
    </script>
</body>
</html>
