<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Fundamentos da Eletricidade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <script id="MathJax-script" async
            src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7fafc;
            color: #2d3748;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .quiz-container {
            max-width: 700px;
            width: 100%;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }
        .question-card {
            border-bottom: 1px solid #e2e8f0;
        }
        .option-button {
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            border: 1px solid #cbd5e0;
        }
        .option-button:not([disabled]):hover {
            background-color: #ebf4ff;
            border-color: #4299e1;
        }
        .correct-answer {
            background-color: #48bb78 !important;
            color: white !important;
            border-color: #38a169 !important;
            font-weight: bold;
        }
        .incorrect-answer {
            background-color: #f56565 !important;
            color: white !important;
            border-color: #e53e3e !important;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="quiz-container p-6 sm:p-10">
        <h1 class="text-3xl font-extrabold text-blue-600 mb-6 text-center border-b pb-3">
            Quiz: Fundamentos da Eletricidade
        </h1>
        <p class="text-center text-gray-600 mb-8">Teste seu conhecimento com estas 10 perguntas.</p>

        <div id="quiz-area"></div>

        <div id="score-card" class="mt-8 p-6 bg-gray-100 rounded-lg hidden">
            <h2 class="text-2xl font-bold text-center text-gray-700">Resultados Finais</h2>
            <p class="text-xl text-center mt-3">Você acertou <span id="correct-count" class="font-extrabold text-blue-600"></span> de 10 perguntas!</p>
            <div id="final-message" class="text-lg font-semibold text-center mt-4"></div>
        </div>
    </div>

    <script>
        const quizQuestions = [
            {
                q: "1. O que, em sua essência, a Corrente Elétrica representa?",
                options: ["A carga total de um material", "A força que move os átomos", "O fluxo ordenado de elétrons através de um condutor", "A resistência de um circuito"],
                answer: "O fluxo ordenado de elétrons através de um condutor",
                rationale: "A corrente elétrica é a medição do movimento contínuo e ordenado de partículas carregadas (elétrons) através de um caminho."
            },
            {
                q: "2. Qual partícula subatômica, ao se mover, é diretamente responsável pela eletricidade?",
                options: ["Próton", "Nêutron", "Elétron", "Núcleo"],
                answer: "Elétron",
                rationale: "Os elétrons, por possuírem carga negativa e estarem na camada externa (valência), são as partículas que se movem nos condutores, criando o fenômeno elétrico."
            },
            {
                q: "3. Qual é a principal característica dos elétrons de valência em materiais considerados bons condutores?",
                options: ["Eles possuem carga positiva", "Eles estão firmemente presos ao núcleo", "Eles se movem de forma caótica", "Eles estão fracamente ligados ao núcleo e são fáceis de mover"],
                answer: "Eles estão fracamente ligados ao núcleo e são fáceis de mover",
                rationale: "Essa fraca ligação é o que permite que os elétrons se movam livremente de átomo para átomo, facilitando o fluxo de corrente."
            },
            {
                q: "4. Qual dos seguintes materiais é mais usado como isolante em cabos residenciais, devido à sua alta resistividade?",
                options: ["Alumínio", "Borracha ou PVC", "Prata", "Água pura"],
                answer: "Borracha ou PVC",
                rationale: "Materiais como Borracha e PVC (Cloreto de Polivinila) têm altíssima resistividade, impedindo que os elétrons escapem dos condutores de cobre ou alumínio."
            },
            {
                q: "5. A unidade de medida 'Ampere' (A) é utilizada para quantificar qual grandeza elétrica?",
                options: ["Resistência", "Corrente Elétrica", "Tensão (Voltagem)", "Potência"],
                answer: "Corrente Elétrica",
                rationale: "O Ampere mede o fluxo de elétrons (Corrente Elétrica) por unidade de tempo, sendo a unidade padrão desta grandeza."
            },
            {
                q: "6. Em termos de resistividade, qual metal é o melhor condutor (possui a menor resistividade)?",
                options: ["Alumínio", "Cobre", "Ouro", "Prata"],
                answer: "Prata",
                rationale: "A Prata é o metal com a menor resistividade, tornando-o o melhor condutor elétrico, embora o Cobre seja o mais comum devido ao custo-benefício."
            },
            {
                q: "7. Como ocorre o acúmulo de cargas na eletricidade estática e como ela se difere da corrente elétrica?",
                options: [
                    "Ocorre por movimento contínuo de elétrons em um circuito fechado.",
                    "Ocorre pelo acúmulo de cargas elétricas em repouso na superfície de um corpo por atrito.",
                    "Ocorre pela fusão do núcleo atômico quando submetido a altas temperaturas.",
                    "Ocorre exclusivamente através do aquecimento de materiais condutores."
                ],
                answer: "Ocorre pelo acúmulo de cargas elétricas em repouso na superfície de um corpo por atrito.",
                rationale: "Diferente da corrente (elétrons em movimento), a eletricidade estática é o acúmulo de cargas em repouso, geralmente gerado por atrito entre materiais."
            },
            {
                q: "8. Embora a Prata possua menor resistividade que o Cobre, por que o Cobre é o metal escolhido para fiações residenciais?",
                options: [
                    "Porque o Cobre não conduz eletricidade e previne choques.",
                    "Porque a Prata derrete em contato com o ar ambiente.",
                    "Pelo excelente equilíbrio entre alta condutividade e custo acessível (custo-benefício).",
                    "Porque o Cobre tem resistividade zero em temperatura ambiente."
                ],
                answer: "Pelo excelente equilíbrio entre alta condutividade e custo acessível (custo-benefício).",
                rationale: "A prata é um metal precioso muito caro. O cobre oferece uma condução elétrica excelente por um preço drasticamente menor, viabilizando as instalações."
            },
            {
                q: "9. O que acontece com a resistividade ($\\rho$) de um condutor metálico quando sua temperatura aumenta?",
                options: [
                    "A resistividade diminui drasticamente.",
                    "A resistividade aumenta, devido à maior agitação dos átomos que dificulta a passagem dos elétrons.",
                    "A resistividade permanece inalterada independente da temperatura.",
                    "O condutor se transforma instantaneamente em um isolante perfeito."
                ],
                answer: "A resistividade aumenta, devido à maior agitação dos átomos que dificulta a passagem dos elétrons.",
                rationale: "Com o aumento da temperatura, os átomos do metal agitam-se mais, gerando mais obstáculos para a passagem ordenada dos elétrons e aumentando a resistividade."
            },
            {
                q: "10. Qual é um exemplo prático do dia a dia citado no estudo da eletricidade estática?",
                options: [
                    "O funcionamento de uma lâmpada LED ligada à tomada.",
                    "O carregamento da bateria de um celular no carregador.",
                    "A atração de pedacinhos de papel por um pente plástico eletrizado por atrito no cabelo.",
                    "A rotação de um motor elétrico trifásico."
                ],
                answer: "A atração de pedacinhos de papel por um pente plástico eletrizado por atrito no cabelo.",
                rationale: "Ao friccionar o pente plástico no cabelo seco, ele se carrega eletrostaticamente por atrito, conseguindo atrair pequenos pedaços de papel sem tocá-los."
            }
        ];

        let questionsAnswered = 0;
        let correctAnswersCount = 0;

        function renderQuiz() {
            const quizArea = document.getElementById('quiz-area');
            quizArea.innerHTML = '';
            
            quizQuestions.forEach((qData, index) => {
                let optionsHtml = '';
                const shuffledOptions = shuffleArray([...qData.options]);

                shuffledOptions.forEach((optionText, optIndex) => {
                    optionsHtml += `
                        <button data-question-index="${index}"
                                data-option-text="${optionText}"
                                onclick="checkAnswer(this, ${index})"
                                class="option-button w-full text-left p-3 rounded-lg block my-2 text-gray-700">
                            ${String.fromCharCode(65 + optIndex)}. ${optionText}
                        </button>
                    `;
                });

                const questionHtml = `
                    <div id="q-card-${index}" class="question-card p-4">
                        <h3 class="text-lg font-bold mb-3">${qData.q}</h3>
                        <div id="options-${index}">${optionsHtml}</div>
                        <div id="feedback-${index}" class="mt-3 p-3 text-sm font-semibold rounded-lg hidden"></div>
                    </div>
                `;
                quizArea.innerHTML += questionHtml;
            });

            if (typeof MathJax !== 'undefined') {
                MathJax.typesetPromise([quizArea]);
            }
        }
        
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        window.checkAnswer = function(selectedButton, qIndex) {
            const qData = quizQuestions[qIndex];
            const selectedText = selectedButton.getAttribute('data-option-text').trim();
            const isCorrect = selectedText === qData.answer;
            const optionsContainer = document.getElementById(`options-${qIndex}`);
            const feedbackElement = document.getElementById(`feedback-${qIndex}`);
            const buttons = optionsContainer.querySelectorAll('button');

            buttons.forEach(btn => { btn.disabled = true; });
            
            if (!selectedButton.classList.contains('incorrect-answer') && !selectedButton.classList.contains('correct-answer')) {
                questionsAnswered++;
                if (isCorrect) { correctAnswersCount++; }
            }
            
            selectedButton.classList.add(isCorrect ? 'correct-answer' : 'incorrect-answer');

            feedbackElement.classList.remove('hidden');
            if (isCorrect) {
                feedbackElement.classList.add('bg-green-100', 'text-green-800');
                feedbackElement.innerHTML = `Parabéns, você acertou! (${qData.rationale})`;
            } else {
                feedbackElement.classList.add('bg-red-100', 'text-red-800');
                feedbackElement.innerHTML = `Incorreto. A resposta correta é: "${qData.answer}". (${qData.rationale})`;
                
                buttons.forEach(btn => {
                    if (btn.getAttribute('data-option-text').trim() === qData.answer) {
                        btn.classList.add('correct-answer');
                    }
                });
            }

            if (typeof MathJax !== 'undefined') {
                MathJax.typesetPromise([feedbackElement, optionsContainer]);
            }
            
            if (questionsAnswered === quizQuestions.length) { displayFinalScore(); }
        };

        function displayFinalScore() {
            const scoreCard = document.getElementById('score-card');
            const correctCountSpan = document.getElementById('correct-count');
            const finalMessageDiv = document.getElementById('final-message');

            correctCountSpan.textContent = correctAnswersCount;
            scoreCard.classList.remove('hidden');

            let message = '';
            if (correctAnswersCount === 10) {
                message = "Excelente! Você demonstrou total domínio dos fundamentos de eletricidade.";
                finalMessageDiv.className = "text-lg font-semibold text-center mt-4 text-green-600";
            } else if (correctAnswersCount >= 7) {
                message = "Muito bom! Você acertou a maioria das questões. Revise os pontos fracos.";
                finalMessageDiv.className = "text-lg font-semibold text-center mt-4 text-blue-600";
            } else {
                message = "Continue estudando! Revise o material sobre elétrons e resistividade para melhorar.";
                finalMessageDiv.className = "text-lg font-semibold text-center mt-4 text-red-600";
            }
            finalMessageDiv.textContent = message;
            scoreCard.scrollIntoView({ behavior: 'smooth' });
        }

        window.onload = renderQuiz;
    </script>
</body>
</html>
