<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Segurança em Eletricidade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- MathJax Config -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <script id="MathJax-script" async
            src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        .option-card {
            transition: all 0.15s ease-in-out;
        }
        .option-card:not([disabled]):hover {
            border-color: #4f46e5;
            background-color: #eef2ff;
            transform: translateY(-1px);
        }
        .correct-answer {
            background-color: #f0fdf4 !important;
            border-color: #22c55e !important;
            color: #15803d !important;
            font-weight: 600;
        }
        .correct-answer .badge-letter {
            background-color: #22c55e !important;
            color: #ffffff !important;
        }
        .incorrect-answer {
            background-color: #fef2f2 !important;
            border-color: #ef4444 !important;
            color: #b91c1c !important;
            font-weight: 600;
        }
        .incorrect-answer .badge-letter {
            background-color: #ef4444 !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body class="min-h-full bg-slate-50 text-slate-800 py-8 px-4 sm:px-6 lg:px-8 flex flex-col items-center">

    <div class="max-w-3xl w-full space-y-6">
        <!-- CABEÇALHO DA PÁGINA -->
        <header class="bg-white rounded-2xl p-6 sm:p-8 shadow-sm border border-slate-200 text-center">

            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
                Quiz: Segurança em Eletricidade
            </h1>
            <p class="mt-2 text-sm sm:text-base text-slate-600 max-w-xl mx-auto">
                Teste seu conhecimento sobre a NR 10, Dispositivo DR, Procedimentos LOTO e Boas Práticas de Segurança.
            </p>

            <!-- BARRA DE PROGRESSO -->
            <div class="mt-6 pt-6 border-t border-slate-100 flex flex-wrap items-center justify-between gap-4 text-xs font-medium text-slate-500">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-indigo-600 animate-pulse"></span>
                    <span id="total-questions-count">10 Questões Técnicas</span>
                </div>
                <div id="progress-text" class="text-slate-700 font-semibold">
                    Respondidas: 0 / 10
                </div>
            </div>
            <div class="w-full bg-slate-100 h-2 rounded-full mt-2 overflow-hidden">
                <div id="progress-bar" class="bg-indigo-600 h-full w-0 transition-all duration-300"></div>
            </div>
        </header>

        <!-- ÁREA DAS QUESTÕES -->
        <main id="quiz-area" class="space-y-6"></main>

        <!-- CARD FINAL DE RESULTADOS -->
        <section id="score-card" class="bg-white rounded-2xl p-6 sm:p-8 shadow-md border border-slate-200 text-center hidden">
            <div id="score-icon" class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-slate-900">Desempenho Final</h2>
            <p class="text-slate-600 mt-2">
                Você acertou <span id="correct-count" class="font-black text-indigo-600 text-2xl">0</span> de <span id="total-count-span">10</span> perguntas.
            </p>
            <div id="final-message" class="mt-4 p-4 rounded-xl text-sm font-semibold"></div>
            
            <button onclick="location.reload()" class="mt-6 px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-sm transition-colors text-sm">
                Refazer Quiz
            </button>
        </section>

    </div>

    <script>
        const quizQuestions = [
            {
                tag: "Proteção DR",
                q: "1. Qual é a função principal do Dispositivo Diferencial Residual (DR) em uma instalação elétrica?",
                options: [
                    "Proteger os equipamentos contra sobrecargas e curtos-circuitos.",
                    "Proteger as pessoas contra choques elétricos por detectar fugas de corrente.",
                    "Interromper o circuito apenas quando a tensão está muito alta.",
                    "Fornecer um caminho de baixa resistência para descargas atmosféricas."
                ],
                answer: "Proteger as pessoas contra choques elétricos por detectar fugas de corrente.",
                rationale: "O DR mede o desequilíbrio entre a corrente de entrada e saída, indicando uma fuga (geralmente através de uma pessoa), e desarma o circuito rapidamente."
            },
            {
                tag: "NBR 5410",
                q: "2. De acordo com a NBR 5410, em qual dos locais listados abaixo o uso do DR é obrigatório?",
                options: [
                    "Apenas em circuitos de iluminação em salas de estar.",
                    "Em todos os circuitos de tomada de uso geral (TUG) em quartos.",
                    "Circuitos que sirvam a pontos de utilização em banheiros, cozinhas e áreas de serviço.",
                    "Circuitos que alimentam apenas motores de baixa potência (até 1 CV)."
                ],
                answer: "Circuitos que sirvam a pontos de utilização em banheiros, cozinhas e áreas de serviço.",
                rationale: "A NBR 5410 exige o DR em áreas molhadas (banheiros, cozinhas, áreas de serviço e externas) para proteção contra choques."
            },
            {
                tag: "Norma NR 10",
                q: "3. Qual é o principal objetivo da Norma Regulamentadora 10 (NR 10)?",
                options: [
                    "Apenas definir as especificações técnicas de cabos e disjuntores.",
                    "Estabelecer requisitos e condições mínimas para garantir a segurança e saúde dos trabalhadores que interagem com eletricidade.",
                    "Regular a tensão máxima permitida em instalações industriais.",
                    "Estabelecer as regras para construções civis e canteiros de obras."
                ],
                answer: "Estabelecer requisitos e condições mínimas para garantir a segurança e saúde dos trabalhadores que interagem com eletricidade.",
                rationale: "A NR 10 foca em medidas de controle e sistemas preventivos para a segurança dos trabalhadores em serviços e instalações elétricas."
            },
            {
                tag: "Fisiologia do Choque",
                q: "4. Em relação à gravidade de um choque elétrico, qual fator é considerado o mais perigoso por afetar diretamente o coração?",
                options: [
                    "A cor da vestimenta de segurança do trabalhador.",
                    "O caminho da corrente elétrica que atravessa o corpo (ex: mão a mão ou mão a pé).",
                    "O volume de água ingerido pela pessoa no momento do choque.",
                    "A espessura do isolamento da ferramenta utilizada."
                ],
                answer: "O caminho da corrente elétrica que atravessa o corpo (ex: mão a mão ou mão a pé).",
                rationale: "O caminho da corrente é crucial, pois um trajeto que inclui o coração (como mão a mão ou mão ao pé esquerdo) traz elevado risco de fibrilação ventricular."
            },
            {
                tag: "Habilitação profissional",
                q: "5. Quem é o trabalhador que, além de ser qualificado ou habilitado, recebeu autorização formal da empresa para intervir em instalações elétricas e passou pelo Curso Básico de NR 10?",
                options: [
                    "Trabalhador Qualificado.",
                    "Profissional Habilitado.",
                    "Eletricista Leigo.",
                    "Trabalhador Autorizado."
                ],
                answer: "Trabalhador Autorizado.",
                rationale: "O Trabalhador Autorizado é o profissional que atende aos requisitos de qualificação/habilitação e recebe a permissão formal da empresa após o treinamento da NR 10."
            },
            {
                tag: "Uso Doméstico",
                q: "6. Qual das seguintes ações representa uma prática segura no manuseio de eletrodomésticos no ambiente doméstico?",
                options: [
                    "Usar adaptadores (benjamins) para conectar múltiplos aparelhos em uma única tomada.",
                    "Consertar fios descascados com fita isolante comum sem desligar o disjuntor.",
                    "Puxar o plugue pelo corpo plástico ao desconectá-lo da tomada.",
                    "Utilizar ferramentas não isoladas para reparos simples na fiação."
                ],
                answer: "Puxar o plugue pelo corpo plástico ao desconectá-lo da tomada.",
                rationale: "Puxar o plugue pelo corpo plástico evita esforço mecânico sobre os fios internos e preserva a integridade do isolamento do cabo."
            },
            {
                tag: "Desenergização / LOTO",
                q: "7. Qual é o primeiro passo obrigatório no Procedimento de Desenergização (Cinco Regras de Ouro da NR 10) antes de iniciar um trabalho em uma instalação elétrica?",
                options: [
                    "Constatação da Ausência de Tensão (CAT).",
                    "Seccionamento (Desligar ou abrir o circuito).",
                    "Instalação do Aterramento Temporário.",
                    "Proteção dos Elementos Vivos Vizinhos."
                ],
                answer: "Seccionamento (Desligar ou abrir o circuito).",
                rationale: "O Seccionamento é o primeiro passo e consiste em seccionar de forma efetiva o circuito ou equipamento das fontes de energia elétrica."
            },
            {
                tag: "Canteiro de Obras",
                q: "8. Em relação à segurança elétrica em Canteiros de Obras (NR 18 / NR 10), qual prática é considerada um risco amplificado e deve ser evitada?",
                options: [
                    "Deixar cabos ou extensões expostos no chão, sujeitos a danos mecânicos e umidade.",
                    "Usar painéis de distribuição (QDC) identificados e trancados.",
                    "Inspecionar o estado de cabos antes de usar ferramentas elétricas.",
                    "Suspender eletrodutos e cabos para proteger a fiação."
                ],
                answer: "Deixar cabos ou extensões expostos no chão, sujeitos a danos mecânicos e umidade.",
                rationale: "Cabos no chão em canteiros de obras ficam expostos ao tráfego de máquinas, água e pisoteio, aumentando os riscos de curtos e choques."
            },
            {
                tag: "Resistência Corporal",
                q: "9. O que acontece com a resistência elétrica do corpo humano ao toque em condutores quando a pele está molhada ou ferida?",
                options: [
                    "A resistência aumenta, diminuindo o risco de choque elétrico.",
                    "A resistência não se altera, pois depende apenas da tensão aplicada.",
                    "A resistência diminui drasticamente, aumentando a intensidade da corrente e o perigo de lesão fatal.",
                    "A resistência se torna infinita, interrompendo a passagem de corrente."
                ],
                answer: "A resistência diminui drasticamente, aumentando a intensidade da corrente e o perigo de lesão fatal.",
                rationale: "A umidade e ferimentos rompem a camada córnea da pele (maior barreira de isolamento do corpo), reduzindo a resistência elétrica corporal ($R$) e aumentando drasticamente a corrente ($I = U/R$)."
            },
            {
                tag: "Qualificação NR 10",
                q: "10. Qual a diferença crucial entre um Trabalhador Qualificado e um Trabalhador Habilitado, conforme a NR 10?",
                options: [
                    "O Habilitado pode trabalhar com alta tensão, o Qualificado não.",
                    "O Habilitado deve ter registro no conselho de classe (CREA/CFT), enquanto o Qualificado apenas concluiu o curso específico formal.",
                    "O Qualificado só pode atuar em áreas secas, o Habilitado em áreas molhadas.",
                    "O Qualificado pode supervisionar instalações, o Habilitado só executa."
                ],
                answer: "O Habilitado deve ter registro no conselho de classe (CREA/CFT), enquanto o Qualificado apenas concluiu o curso específico formal.",
                rationale: "O profissional Habilitado é aquele previamente qualificado e que possui registro competente no conselho de classe profissional correspondente."
            }
        ];

        let questionsAnswered = 0;
        let correctAnswersCount = 0;

        function renderQuiz() {
            const quizArea = document.getElementById('quiz-area');
            quizArea.innerHTML = '';
            
            quizQuestions.forEach((qData, index) => {
                let optionsHtml = '';

                qData.options.forEach((optionText, optIndex) => {
                    const letter = String.fromCharCode(65 + optIndex);
                    optionsHtml += `
                        <button data-question-index="${index}"
                                data-option-text="${optionText.replace(/"/g, '&quot;')}"
                                onclick="checkAnswer(this, ${index})"
                                class="option-card w-full text-left p-3.5 sm:p-4 rounded-xl border border-slate-200 bg-white flex items-start space-x-3 group">
                            <span class="badge-letter flex-shrink-0 w-7 h-7 rounded-lg bg-slate-100 text-slate-700 font-bold text-xs flex items-center justify-center transition-colors group-hover:bg-indigo-100 group-hover:text-indigo-700">
                                ${letter}
                            </span>
                            <span class="text-slate-700 text-sm sm:text-base leading-snug pt-0.5">
                                ${optionText}
                            </span>
                        </button>
                    `;
                });

                const questionHtml = `
                    <article id="q-card-${index}" class="bg-white rounded-2xl p-5 sm:p-7 shadow-sm border border-slate-200 space-y-4">
                        <div class="flex items-center justify-between gap-2 border-b border-slate-100 pb-3">
                            <span class="px-2.5 py-0.5 bg-indigo-50 text-indigo-600 font-semibold text-xs rounded-md uppercase tracking-wider">
                                ${qData.tag}
                            </span>
                            <span class="text-xs font-medium text-slate-400">Questão ${index + 1} de ${quizQuestions.length}</span>
                        </div>
                        
                        <h3 class="text-base sm:text-lg font-bold text-slate-900 leading-snug">
                            ${qData.q}
                        </h3>
                        
                        <div id="options-${index}" class="space-y-2.5 pt-1">
                            ${optionsHtml}
                        </div>
                        
                        <div id="feedback-${index}" class="mt-4 p-4 text-xs sm:text-sm font-medium rounded-xl hidden border leading-relaxed"></div>
                    </article>
                `;
                quizArea.innerHTML += questionHtml;
            });

            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise();
            }
        }

        window.checkAnswer = function(selectedButton, qIndex) {
            const qData = quizQuestions[qIndex];
            const selectedText = selectedButton.getAttribute('data-option-text').trim();
            const isCorrect = selectedText === qData.answer;
            const optionsContainer = document.getElementById(`options-${qIndex}`);
            const feedbackElement = document.getElementById(`feedback-${qIndex}`);
            const buttons = optionsContainer.querySelectorAll('button');

            buttons.forEach(btn => { btn.disabled = true; });
            
            questionsAnswered++;
            if (isCorrect) { correctAnswersCount++; }
            updateProgressBar();
            
            selectedButton.classList.add(isCorrect ? 'correct-answer' : 'incorrect-answer');

            feedbackElement.classList.remove('hidden');
            if (isCorrect) {
                feedbackElement.classList.add('bg-emerald-50', 'text-emerald-900', 'border-emerald-200');
                feedbackElement.innerHTML = `<strong>Correto!</strong> ${qData.rationale}`;
            } else {
                feedbackElement.classList.add('bg-rose-50', 'text-rose-900', 'border-rose-200');
                feedbackElement.innerHTML = `<strong>Incorreto.</strong> A resposta certa é: <em>"${qData.answer}"</em>.<br><span class="mt-1 block">${qData.rationale}</span>`;
                
                buttons.forEach(btn => {
                    if (btn.getAttribute('data-option-text').trim() === qData.answer) {
                        btn.classList.add('correct-answer');
                    }
                });
            }

            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([feedbackElement]);
            }
            
            if (questionsAnswered === quizQuestions.length) { 
                displayFinalScore(); 
            }
        };

        function updateProgressBar() {
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');
            const percentage = (questionsAnswered / quizQuestions.length) * 100;
            
            progressBar.style.width = `${percentage}%`;
            progressText.textContent = `Respondidas: ${questionsAnswered} / ${quizQuestions.length}`;
        }

        function displayFinalScore() {
            const scoreCard = document.getElementById('score-card');
            const correctCountSpan = document.getElementById('correct-count');
            const totalCountSpan = document.getElementById('total-count-span');
            const finalMessageDiv = document.getElementById('final-message');
            const scoreIcon = document.getElementById('score-icon');

            correctCountSpan.textContent = correctAnswersCount;
            totalCountSpan.textContent = quizQuestions.length;
            scoreCard.classList.remove('hidden');

            const percentage = (correctAnswersCount / quizQuestions.length) * 100;

            if (percentage >= 85) {
                scoreIcon.className = "w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4";
                finalMessageDiv.className = "mt-4 p-4 rounded-xl text-sm font-semibold bg-emerald-50 text-emerald-800 border border-emerald-200";
                finalMessageDiv.textContent = "Excelente! Você tem um ótimo conhecimento sobre as normas de segurança, aplicação de DR e regras da NR 10.";
            } else if (percentage >= 60) {
                scoreIcon.className = "w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4";
                finalMessageDiv.className = "mt-4 p-4 rounded-xl text-sm font-semibold bg-indigo-50 text-indigo-800 border border-indigo-200";
                finalMessageDiv.textContent = "Bom resultado! Você compreende bem os princípios de proteção, mas vale a pena revisar os procedimentos de desenergização e habilitação.";
            } else {
                scoreIcon.className = "w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4";
                finalMessageDiv.className = "mt-4 p-4 rounded-xl text-sm font-semibold bg-amber-50 text-amber-800 border border-amber-200";
                finalMessageDiv.textContent = "Precisa revisar: Foque na leitura das regras de desenergização da NR 10, atuadores do DR e exigências de proteção pessoal.";
            }

            scoreCard.scrollIntoView({ behavior: 'smooth' });
        }

        window.onload = renderQuiz;
    </script>
</body>
</html>
